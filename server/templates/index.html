<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Load Metadata</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 20px;
        color: #1f2937;
        background: #f8fafc;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 18px;
        max-width: 920px;
        box-shadow: 0 8px 20px rgba(17, 24, 39, 0.06);
      }
      h1 {
        margin-top: 0;
        color: #1d4ed8;
      }
      input[type="text"] {
        width: 100%;
        max-width: 860px;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      button {
        margin-top: 10px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      ul {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        border-radius: 10px;
        padding: 10px 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
    <h1>Load Metadata File</h1>
    <!-- Preserve existing flash messages for error handling -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
        {% for msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post">
      <label for="metadata_path">Full path to metadata file (CSV or ODS):</label><br/>
      <input id="metadata_path" name="metadata_path" type="text" size="100" placeholder="e.g., C:\Users\Asus\Desktop\python_work\data\RawData\RawData\Experiments.ods" required />
      <button type="submit">Load</button>
    </form>

    <p><small>Required columns in metadata: TribuId, RloadId, SampleIdTriboNeg, SampleIdTriboPos.</small></p>
    </div>

  </body>
</html>
